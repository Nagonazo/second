<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR冒険ストーリー</title>
    <!-- A-Frame本体 -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <!-- AR.js -->
    <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/2.0.1/aframe/build/aframe-ar.min.js"></script>
    <!-- 日本語対応のtroika-text -->
    <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden">
    <a-scene embedded arjs>
      <a-marker preset="hiro">
        <!-- メインテキスト -->
        <a-entity
          id="mainText"
          troika-text="value: 冒険が始まる！どこへ行く？; color: white; fontSize: 0.08; font: https://fonts.gstatic.com/s/notosansjp/v52/-F6ofjtqLzI2JPCgQBnw7HFQogg.woff"
          position="0 1.3 0"
          rotation="-90 0 0"
        ></a-entity>

        <!-- 第一選択肢 -->
        <a-entity
          id="choice1"
          troika-text="value: 1. 洞窟に入る; color: cyan; fontSize: 0.06; font: https://fonts.gstatic.com/s/notosansjp/v52/-F6ofjtqLzI2JPCgQBnw7HFQogg.woff"
          position="-0.7 1.0 0"
          rotation="-90 0 0"
        ></a-entity>
        <a-entity
          id="choice2"
          troika-text="value: 2. 森へ進む; color: lime; fontSize: 0.06; font: https://fonts.gstatic.com/s/notosansjp/v52/-F6ofjtqLzI2JPCgQBnw7HFQogg.woff"
          position="0.7 1.0 0"
          rotation="-90 0 0"
        ></a-entity>

        <!-- 第二選択肢（洞窟） -->
        <a-entity
          id="caveA"
          troika-text="value: A. 慎重に取る; color: orange; fontSize: 0.05; font: https://fonts.gstatic.com/s/notosansjp/v52/-F6ofjtqLzI2JPCgQBnw7HFQogg.woff"
          position="-0.7 0.7 0"
          rotation="-90 0 0"
          visible="false"
        ></a-entity>
        <a-entity
          id="caveB"
          troika-text="value: B. 一気に奪う; color: red; fontSize: 0.05; font: https://fonts.gstatic.com/s/notosansjp/v52/-F6ofjtqLzI2JPCgQBnw7HFQogg.woff"
          position="0.7 0.7 0"
          rotation="-90 0 0"
          visible="false"
        ></a-entity>

        <!-- 第二選択肢（森） -->
        <a-entity
          id="forestA"
          troika-text="value: A. 戦う; color: orange; fontSize: 0.05; font: https://fonts.gstatic.com/s/notosansjp/v52/-F6ofjtqLzI2JPCgQBnw7HFQogg.woff"
          position="-0.7 0.7 0"
          rotation="-90 0 0"
          visible="false"
        ></a-entity>
        <a-entity
          id="forestB"
          troika-text="value: B. 逃げる; color: red; fontSize: 0.05; font: https://fonts.gstatic.com/s/notosansjp/v52/-F6ofjtqLzI2JPCgQBnw7HFQogg.woff"
          position="0.7 0.7 0"
          rotation="-90 0 0"
          visible="false"
        ></a-entity>

        <!-- 結果 -->
        <a-entity
          id="result"
          troika-text="value: ; color: yellow; fontSize: 0.06; font: https://fonts.gstatic.com/s/notosansjp/v52/-F6ofjtqLzI2JPCgQBnw7HFQogg.woff"
          position="0 0.4 0"
          rotation="-90 0 0"
        ></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const mainText = document.querySelector('#mainText');
      const result = document.querySelector('#result');

      const choice1 = document.querySelector('#choice1');
      const choice2 = document.querySelector('#choice2');

      const caveA = document.querySelector('#caveA');
      const caveB = document.querySelector('#caveB');

      const forestA = document.querySelector('#forestA');
      const forestB = document.querySelector('#forestB');

      // 洞窟ルート
      choice1.addEventListener('click', () => {
        mainText.setAttribute('troika-text', 'value: 宝を見つけた！どうする？');
        choice1.setAttribute('visible', false);
        choice2.setAttribute('visible', false);
        caveA.setAttribute('visible', true);
        caveB.setAttribute('visible', true);
      });

      // 森ルート
      choice2.addEventListener
