<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>AR 日本語テキスト対応サンプル</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/2.0.1/aframe/build/aframe-ar.min.js"></script>
  <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>
  <style> body { margin: 0; overflow: hidden; } </style>
</head>
<body>
  <a-scene embedded arjs>
    <a-marker preset="hiro" cursor="rayOrigin: mouse">
      <!-- メインテキスト -->
      <a-entity id="mainText" troika-text="value: 冒険が始まる！どこへ行く？; color: white; fontSize: 0.1; font: https://fonts.gstatic.com/ea/notosansjp/v6/NotoSansJP-Regular.otf" position="0 1.3 0" rotation="-90 0 0"></a-entity>

      <!-- 選択肢 -->
      <a-entity id="choice1" troika-text="value: 1. 洞窟に入る; color: cyan; fontSize: 0.07; font: https://fonts.gstatic.com/ea/notosansjp/v6/NotoSansJP-Regular.otf" position="-0.7 1 0" rotation="-90 0 0" class="clickable"></a-entity>
      <a-entity id="choice2" troika-text="value: 2. 森へ進む; color: lime; fontSize: 0.07; font: https://fonts.gstatic.com/ea/notosansjp/v6/NotoSansJP-Regular.otf" position="0.7 1 0" rotation="-90 0 0" class="clickable"></a-entity>

      <!-- 第二選択肢（洞窟） -->
      <a-entity id="caveA" troika-text="value: A. 慎重に取る; color: orange; fontSize: 0.06; font: https://fonts.gstatic.com/ea/notosansjp/v6/NotoSansJP-Regular.otf" position="-0.7 0.7 0" rotation="-90 0 0" visible="false" class="clickable"></a-entity>
      <a-entity id="caveB" troika-text="value: B. 一気に奪う; color: red; fontSize: 0.06; font: https://fonts.gstatic.com/ea/notosansjp/v6/NotoSansJP-Regular.otf" position="0.7 0.7 0" rotation="-90 0 0" visible="false" class="clickable"></a-entity>

      <!-- 第二選択肢（森） -->
      <a-entity id="forestA" troika-text="value: A. 戦う; color: orange; fontSize: 0.06; font: https://fonts.gstatic.com/ea/notosansjp/v6/NotoSansJP-Regular.otf" position="-0.7 0.7 0" rotation="-90 0 0" visible="false" class="clickable"></a-entity>
      <a-entity id="forestB" troika-text="value: B. 逃げる; color: red; fontSize: 0.06; font: https://fonts.gstatic.com/ea/notosansjp/v6/NotoSansJP-Regular.otf" position="0.7 0.7 0" rotation="-90 0 0" visible="false" class="clickable"></a-entity>

      <!-- 結果テキスト -->
      <a-entity id="result" troika-text="value: ; color: yellow; fontSize: 0.08; font: https://fonts.gstatic.com/ea/notosansjp/v6/NotoSansJP-Regular.otf" position="0 0.4 0" rotation="-90 0 0"></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // テキスト更新のための補助関数
    function updateText(el, text) {
      el.setAttribute('troika-text', 'value', text);
      // troika-textは sync() を呼ばないと即時反映しないことがある
      el.components['troika-text'].sync();
    }

    const mainText = document.querySelector('#mainText');
    const result = document.querySelector('#result');

    const choice1 = document.querySelector('#choice1');
    const choice2 = document.querySelector('#choice2');

    const caveA = document.querySelector('#caveA');
    const caveB = document.querySelector('#caveB');

    const forestA = document.querySelector('#forestA');
    const forestB = document.querySelector('#forestB');

    // 最初の選択肢をクリックした時の処理
    choice1.addEventListener('click', () => {
      updateText(mainText, '宝を見つけた！どうする？');
      choice1.setAttribute('visible', false);
      choice2.setAttribute('visible', false);
      caveA.setAttribute('visible', true);
      caveB.setAttribute('visible', true);
      result.setAttribute('visible', false);
    });

    choice2.addEventListener('click', () => {
      updateText(mainText, 'モンスターが現れた！どうする？');
      choice1.setAttribute('visible', false);
      choice2.setAttribute('visible', false);
      forestA.setAttribute('visible', true);
      forestB.setAttribute('visible', true);
      result.setAttribute('visible', false);
    });

    // 洞窟ルート
    caveA.addEventListener('click', () => {
      updateText(result, '宝を無事にゲット！');
      result.setAttribute('visible', true);
      caveA.setAttribute('visible', false);
      caveB.setAttribute('visible', false);
    });
    caveB.addEventListener('click', () => {
      updateText(result, '罠が発動！脱出ゲーム開始！');
      result.setAttribute('visible', true);
      caveA.setAttribute('visible', false);
      caveB.setAttribute('visible', false);
    });

    // 森ルート
    forestA.addEventListener('click', () => {
      updateText(result, 'モンスターを倒した！');
      result.setAttribute('visible', true);
      forestA.setAttribute('visible', false);
      forestB.setAttribute('visible', false);
    });
    forestB.addEventListener('click', () => {
      updateText(result, '迷子になってしまった…');
      result.setAttribute('visible', true);
      forestA.setAttribute('visible', false);
      forestB.setAttribute('visible', false);
    });
  </script>
</body>
</html>
