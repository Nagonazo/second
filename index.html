<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/2.0.1/aframe/build/aframe-ar.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
      <!-- カーソル（タップ操作有効化） -->
      <a-entity camera>
        <a-cursor></a-cursor>
      </a-entity>

      <a-marker preset="hiro">
        <!-- メインテキスト -->
        <a-text id="mainText" value="冒険が始まる！どこへ行く？" position="0 1.2 0.1" align="center" color="white" width="4" rotation="-90 0 0"></a-text>

        <!-- 第1選択肢 -->
        <a-plane id="btn1" position="-0.8 0.9 0.1" width="1.5" height="0.4" color="cyan" rotation="-90 0 0"></a-plane>
        <a-text value="1 洞窟に入る" position="-0.8 0.9 0.11" align="center" color="black" width="2" rotation="-90 0 0"></a-text>

        <a-plane id="btn2" position="0.8 0.9 0.1" width="1.5" height="0.4" color="lime" rotation="-90 0 0"></a-plane>
        <a-text value="2 森へ進む" position="0.8 0.9 0.11" align="center" color="black" width="2" rotation="-90 0 0"></a-text>

        <!-- 洞窟選択肢 -->
        <a-plane id="caveA" position="-0.8 0.6 0.1" width="1.5" height="0.4" color="orange" visible="false" rotation="-90 0 0"></a-plane>
        <a-text value="A 慎重に取る" id="caveAText" position="-0.8 0.6 0.11" align="center" color="black" width="2" visible="false" rotation="-90 0 0"></a-text>

        <a-plane id="caveB" position="0.8 0.6 0.1" width="1.5" height="0.4" color="red" visible="false" rotation="-90 0 0"></a-plane>
        <a-text value="B 一気に奪う" id="caveBText" position="0.8 0.6 0.11" align="center" color="black" width="2" visible="false" rotation="-90 0 0"></a-text>

        <!-- 森選択肢 -->
        <a-plane id="forestA" position="-0.8 0.6 0.1" width="1.5" height="0.4" color="orange" visible="false" rotation="-90 0 0"></a-plane>
        <a-text value="A. 戦う" id="forestAText" position="-0.8 0.6 0.11" align="center" color="black" width="2" visible="false" rotation="-90 0 0"></a-text>

        <a-plane id="forestB" position="0.8 0.6 0.1" width="1.5" height="0.4" color="red" visible="false" rotation="-90 0 0"></a-plane>
        <a-text value="B. 逃げる" id="forestBText" position="0.8 0.6 0.11" align="center" color="black" width="2" visible="false" rotation="-90 0 0"></a-text>

        <!-- 結果テキスト -->
        <a-text id="result" value="" position="0 0.3 0.1" align="center" color="yellow" width="4" rotation="-90 0 0"></a-text>
      </a-marker>
    </a-scene>

    <script>
      const mainText = document.querySelector('#mainText');
      const result = document.querySelector('#result');

      const btn1 = document.querySelector('#btn1');
      const btn2 = document.querySelector('#btn2');

      const caveA = document.querySelector('#caveA');
      const caveAText = document.querySelector('#caveAText');
      const caveB = document.querySelector('#caveB');
      const caveBText = document.querySelector('#caveBText');

      const forestA = document.querySelector('#forestA');
      const forestAText = document.querySelector('#forestAText');
      const forestB = document.querySelector('#forestB');
      const forestBText = document.querySelector('#forestBText');

      // 洞窟ルート
      btn1.addEventListener('click', () => {
        mainText.setAttribute('value', '宝を見つけた！どうする？');
        btn1.setAttribute('visible', false);
        btn2.setAttribute('visible', false);
        caveA.setAttribute('visible', true);
        caveAText.setAttribute('visible', true);
        caveB.setAttribute('visible', true);
        caveBText.setAttribute('visible', true);
      });

      // 森ルート
      btn2.addEventListener('click', () => {
        mainText.setAttribute('value', 'モンスターが現れた！どうする？');
        btn1.setAttribute('visible', false);
        btn2.setAttribute('visible', false);
        forestA.setAttribute('visible', true);
        forestAText.setAttribute('visible', true);
        forestB.setAttribute('visible', true);
        forestBText.setAttribute('visible', true);
      });

      // 洞窟選択肢の結果
      caveA.addEventListener('click', () => {
        result.setAttribute('value', '宝を無事にゲット！');
      });

      caveB.addEventListener('click', () => {
        result.setAttribute('value', '罠が発動！脱出ゲーム開始！');
      });

      // 森選択肢の結果
      forestA.addEventListener('click', () => {
        result.setAttribute('value', 'モンスターを倒した！');
      });

      forestB.addEventListener('click', () => {
        result.setAttribute('value', '迷子になってしまった…');
      });
    </script>
  </body>
</html>
